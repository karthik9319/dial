<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dial — Focus Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22%2317181c%22 stroke=%22%23c9a227%22 stroke-width=%226%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

<main class="console">

  <div class="console__fixed">

    <div class="topbar">
      <h1 class="topbar__brand">DIAL</h1>
      <div class="topbar__actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
          <span aria-hidden="true">◐</span>
        </button>
        <button id="openSettings" class="icon-btn" type="button" aria-label="Open settings" title="Settings">
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </div>

    <section class="modes" role="tablist" aria-label="Timer mode">
      <button class="mode-btn" data-mode="focus" role="tab" aria-selected="true">Focus</button>
      <button class="mode-btn" data-mode="short" role="tab" aria-selected="false">Short</button>
      <button class="mode-btn" data-mode="long" role="tab" aria-selected="false">Long</button>
      <button class="mode-btn" data-mode="custom" role="tab" aria-selected="false">Custom</button>
    </section>

    <div class="custom-duration" id="customDuration" hidden>
      <label for="customMinutesInput" class="custom-duration__label">Minutes</label>
      <div class="stepper">
        <button type="button" class="stepper__btn" id="customMinusBtn" aria-label="Decrease minutes">−</button>
        <input type="number" id="customMinutesInput" class="stepper__input" min="1" max="120" value="10" inputmode="numeric">
        <button type="button" class="stepper__btn" id="customPlusBtn" aria-label="Increase minutes">+</button>
      </div>
    </div>

    <div class="task-input-wrap">
      <input id="taskInput" class="task-input" type="text" maxlength="60" placeholder="What are you focusing on?" autocomplete="off" list="taskSuggestions">
    </div>

    <datalist id="taskSuggestions"></datalist>

    <section class="dial-wrap">
      <svg class="dial" viewBox="0 0 300 300" aria-hidden="true">
        <circle class="dial__track" cx="150" cy="150" r="130" />
        <circle class="dial__progress" id="dialProgress" cx="150" cy="150" r="130" />
      </svg>
      <div class="dial__center">
        <div class="dial__time" id="timeDisplay">25:00</div>
        <div class="dial__label" id="modeLabel">Focus</div>
      </div>
    </section>

    <section class="controls">
      <button id="startPauseBtn" class="btn btn--primary" type="button">Start</button>
      <button id="resetBtn" class="btn" type="button">Reset</button>
    </section>

    <section class="stats-row">
      <div class="stat">
        <div class="stat__value" id="statStreak">0</div>
        <div class="stat__label">Streak</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="statToday">0</div>
        <div class="stat__label">Today</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="statLevel">1</div>
        <div class="stat__label">Level</div>
      </div>
    </section>

    <section class="xp-panel">
      <div class="xp-panel__head">
        <span>XP</span>
        <span id="xpText">0 / 100</span>
      </div>
      <div class="xp-bar">
        <div class="xp-bar__fill" id="xpFill"></div>
      </div>
    </section>

  </div>

  <div class="tabs" role="tablist" aria-label="Panels">
    <button class="tab" type="button" role="tab" id="tabTasks" aria-controls="paneTasks" aria-selected="true" data-pane="paneTasks">Tasks</button>
    <button class="tab" type="button" role="tab" id="tabStats" aria-controls="paneStats" aria-selected="false" data-pane="paneStats">Stats</button>
    <button class="tab" type="button" role="tab" id="tabLog" aria-controls="paneLog" aria-selected="false" data-pane="paneLog">Log</button>
  </div>

  <div class="panes">

    <div class="pane" id="paneTasks" role="tabpanel" aria-labelledby="tabTasks">
      <section class="panel">
        <form class="todo-add" id="todoForm">
          <input type="text" id="todoInput" class="todo-add__input" maxlength="60" placeholder="Add a task…" autocomplete="off" list="taskSuggestions">
          <input type="number" id="todoMinutesInput" class="todo-add__minutes" min="1" max="120" value="10" aria-label="Minutes">
          <button type="submit" class="todo-add__btn" aria-label="Add task">+</button>
        </form>
        <div class="todo-list" id="todoList">
          <p class="todo-empty" id="todoEmpty">No tasks yet. Add one above.</p>
        </div>
        <button type="button" class="todo-clear" id="clearDoneBtn" hidden>Clear completed</button>
      </section>
    </div>

    <div class="pane" id="paneStats" role="tabpanel" aria-labelledby="tabStats" hidden>
      <section class="panel">
        <div class="stats-figures">
          <div class="figure">
            <div class="figure__value" id="figTodayCount">0</div>
            <div class="figure__label">Today</div>
            <div class="figure__sub" id="figTodayMinutes">0m</div>
          </div>
          <div class="figure">
            <div class="figure__value" id="figWeekCount">0</div>
            <div class="figure__label">7 days</div>
            <div class="figure__sub" id="figWeekMinutes">0m</div>
          </div>
          <div class="figure">
            <div class="figure__value" id="figMonthCount">0</div>
            <div class="figure__label">30 days</div>
            <div class="figure__sub" id="figMonthMinutes">0m</div>
          </div>
        </div>
        <div class="chart" id="statsChart"></div>
        <p class="chart__note">Sessions per day · dashed line is your daily goal</p>
      </section>

      <section class="panel">
        <h2 class="panel__title">Badges</h2>
        <div class="badges" id="badgesRow"></div>
      </section>
    </div>

    <div class="pane" id="paneLog" role="tabpanel" aria-labelledby="tabLog" hidden>
      <section class="panel">
        <div class="log" id="sessionLog">
          <p class="log__empty" id="logEmpty">No sessions logged yet. Start your first focus session.</p>
        </div>
      </section>
    </div>

  </div>

  <div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="sheet__head">
      <button class="icon-btn" type="button" id="closeSettings" aria-label="Close settings">
        <span aria-hidden="true">‹</span>
      </button>
      <h2 class="sheet__title" id="settingsTitle">Settings</h2>
    </div>
    <div class="sheet__body">

      <div class="setting-row">
        <label for="setFocus">Focus</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" data-step="focusMinutes:-1" aria-label="Decrease focus minutes">−</button>
          <input type="number" id="setFocus" class="stepper__input" min="1" max="120" inputmode="numeric">
          <button type="button" class="stepper__btn" data-step="focusMinutes:1" aria-label="Increase focus minutes">+</button>
        </div>
      </div>

      <div class="setting-row">
        <label for="setShort">Short break</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" data-step="shortMinutes:-1" aria-label="Decrease short break minutes">−</button>
          <input type="number" id="setShort" class="stepper__input" min="1" max="60" inputmode="numeric">
          <button type="button" class="stepper__btn" data-step="shortMinutes:1" aria-label="Increase short break minutes">+</button>
        </div>
      </div>

      <div class="setting-row">
        <label for="setLong">Long break</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" data-step="longMinutes:-1" aria-label="Decrease long break minutes">−</button>
          <input type="number" id="setLong" class="stepper__input" min="1" max="60" inputmode="numeric">
          <button type="button" class="stepper__btn" data-step="longMinutes:1" aria-label="Increase long break minutes">+</button>
        </div>
      </div>

      <div class="setting-row">
        <label for="setGoal">Daily goal</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" data-step="dailyGoal:-1" aria-label="Decrease daily goal">−</button>
          <input type="number" id="setGoal" class="stepper__input" min="1" max="24" inputmode="numeric">
          <button type="button" class="stepper__btn" data-step="dailyGoal:1" aria-label="Increase daily goal">+</button>
        </div>
      </div>

      <div class="setting-row">
        <label for="setAlarm">Alarm</label>
        <select id="setAlarm" class="setting-select">
          <option value="chime">Chime</option>
          <option value="bell">Bell</option>
          <option value="pulse">Pulse</option>
          <option value="none">Silent</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="setVolume">Volume</label>
        <input type="range" id="setVolume" class="setting-range" min="0" max="100" step="5">
      </div>

      <label class="setting-check">
        <input type="checkbox" id="setAutoStart">
        <span>Auto-start next session</span>
      </label>

      <label class="setting-check">
        <input type="checkbox" id="setNotify">
        <span>Notify when a session ends</span>
      </label>

    </div>
  </div>

</main>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
